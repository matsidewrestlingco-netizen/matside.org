<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Story Flow — Matside Wrestling Co.</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0d1117;
      --bg-card:       #151b23;
      --bg-card-hover: #1c2430;
      --border:        #2a3441;
      --blue:          #4a8fd4;
      --blue-light:    #6aaee8;
      --blue-dim:      #1e3a52;
      --blue-dim-border: #2d5278;
      --white:         #ffffff;
      --gray:          #8b9ab0;
      --gray-dim:      #4a5568;
      --danger-border: #c9414f;
      --danger-text:   #ff6b7a;
      --danger-bg:     #6b2737;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border);
    }
    .logo-main {
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .logo-divider {
      width: 1px;
      height: 36px;
      background: var(--border);
    }
    .page-title {
      font-size: 13px;
      color: var(--gray);
    }

    /* ── Progress ── */
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 6px;
    }
    .progress-meta span:last-child { color: var(--blue); font-weight: 600; }
    .progress-bar-bg {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Complete banner ── */
    .complete-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--blue-dim);
      border: 0.5px solid var(--blue-dim-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 1.25rem;
    }
    .complete-banner.visible { display: flex; }
    .complete-banner span { font-size: 13px; color: var(--blue-light); font-weight: 500; }

    /* ── Stage cards ── */
    .stage-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
      margin-bottom: 8px;
    }
    .stage-card.complete { border-color: var(--blue-dim-border); }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .stage-header:hover { background: var(--bg-card-hover); }

    .stage-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      color: var(--gray);
      transition: all 0.2s;
    }
    .stage-card.complete .stage-num {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    .stage-info { flex: 1; }
    .stage-title { font-size: 14px; font-weight: 500; color: var(--white); }
    .stage-subtitle { font-size: 11px; color: var(--gray); margin-top: 2px; }

    .note-indicator { font-size: 11px; color: var(--gray-dim); margin-right: 4px; }
    .chevron { font-size: 12px; color: var(--gray-dim); transition: transform 0.2s; display: inline-block; }
    .stage-card.open .chevron { transform: rotate(180deg); }

    .stage-body {
      display: none;
      padding: 0 14px 14px;
      border-top: 0.5px solid var(--border);
    }
    .stage-card.open .stage-body { display: block; }

    .stage-desc {
      font-size: 13px;
      color: var(--gray);
      margin: 10px 0 12px;
      line-height: 1.5;
    }

    /* ── Dept grid ── */
    .dept-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dept-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 0.5px solid var(--border);
      transition: all 0.15s;
      color: var(--gray);
    }
    .dept-item.checked {
      background: var(--blue-dim);
      border-color: var(--blue-dim-border);
      color: var(--blue-light);
    }

    /* ── Check label ── */
    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 0.5px solid var(--border);
      width: fit-content;
      transition: all 0.15s;
      color: var(--gray);
      margin-bottom: 12px;
    }
    .check-label.checked {
      background: var(--blue-dim);
      border-color: var(--blue-dim-border);
      color: var(--blue-light);
    }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--white);
      outline: none;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.15s;
      min-height: 60px;
    }
    textarea:focus { border-color: var(--blue); }
    textarea::placeholder { color: var(--gray-dim); }

    /* ── Buttons ── */
    .btn-restart {
      background: transparent;
      color: var(--blue);
      border: 0.5px solid var(--blue-dim-border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-restart:hover { background: var(--blue-dim); }

    .btn-reset {
      background: transparent;
      color: var(--gray-dim);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-reset:hover { color: var(--gray); border-color: var(--gray-dim); }

    .footer-row {
      margin-top: 1rem;
      text-align: right;
    }

    input[type="checkbox"] {
      accent-color: var(--blue);
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="logo-wrap">
    <div>
      <div class="logo-main">Matside</div>
      <div class="logo-sub">Wrestling Co.</div>
    </div>
    <div class="logo-divider"></div>
    <div class="page-title">User Story Flow</div>
  </div>

  <div class="progress-meta">
    <span id="progress-label">0 of 9 stages complete</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div class="complete-banner" id="complete-banner">
    <span>All stages complete — ready for the next run!</span>
    <button class="btn-restart" onclick="resetFlow()">Start new run</button>
  </div>

  <div id="stages"></div>

  <div class="footer-row">
    <button class="btn-reset" onclick="resetFlow()">Reset progress</button>
  </div>

</div>

<script>
  const STORAGE_KEY = 'matside_flow_v3';

  const STAGES = [
    { id: 'ai_ideation',    label: 'AI Ideation',                          desc: 'Use Claude to brainstorm and generate initial user stories.' },
    { id: 'dept_reviews',   label: 'Department Reviews',                   desc: 'Collect additions from all department heads.', hasSubs: true },
    { id: 'sizing',         label: 'Sizing & Estimation',                  desc: 'T-shirt size or story-point each user story.' },
    { id: 'prioritization', label: 'Prioritization',                       desc: 'MoSCoW or High/Med/Low pass on all stories.' },
    { id: 'dependencies',   label: 'Dependencies & Acceptance Criteria',   desc: 'Map story dependencies and define acceptance criteria.' },
    { id: 'cos_review',     label: 'Chief of Staff Review',                desc: 'Final alignment check with Chief of Staff.' },
    { id: 'exec_signoff',   label: 'Exec / Product Owner Sign-off',        desc: 'Exec sponsor or product owner approves the story set.' },
    { id: 'manual_review',  label: 'Manual Review',                        desc: 'Personal review pass before backlog entry.' },
    { id: 'backlog_grooming', label: 'Backlog Grooming',                   desc: 'Sprint-ready check: stories are small, clear, and assigned.' },
  ];

  const DEPTS = ['Marketing', 'Operations', 'Customer Success', 'Finance', 'Engineering', 'Planning'];

  function defaultState() {
    return {
      stages: Object.fromEntries(STAGES.map(s => [s.id, false])),
      depts:  Object.fromEntries(DEPTS.map(d => [d, false])),
      notes:  Object.fromEntries(STAGES.map(s => [s.id, ''])),
    };
  }

  let state = defaultState();

  function load() {
    try { const s = localStorage.getItem(STORAGE_KEY); if (s) state = JSON.parse(s); } catch {}
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  function isStageComplete(id) {
    if (id === 'dept_reviews') return DEPTS.every(d => state.depts[d]);
    return state.stages[id];
  }

  function completedCount() {
    return STAGES.filter(s => isStageComplete(s.id)).length;
  }

  function updateProgress() {
    const done = completedCount();
    const pct  = Math.round((done / STAGES.length) * 100);
    document.getElementById('progress-label').textContent = `${done} of ${STAGES.length} stages complete`;
    document.getElementById('progress-pct').textContent   = `${pct}%`;
    document.getElementById('progress-fill').style.width  = `${pct}%`;
    const banner = document.getElementById('complete-banner');
    if (done === STAGES.length) banner.classList.add('visible');
    else banner.classList.remove('visible');
  }

  function updateCard(id) {
    const card = document.getElementById('card-' + id);
    if (!card) return;
    const complete = isStageComplete(id);
    card.classList.toggle('complete', complete);
    const numEl = card.querySelector('.stage-num');
    const idx   = STAGES.findIndex(s => s.id === id);
    numEl.textContent = complete ? '✓' : (idx + 1);

    if (id === 'dept_reviews') {
      const done  = DEPTS.filter(d => state.depts[d]).length;
      const subEl = card.querySelector('.stage-subtitle');
      if (subEl) subEl.textContent = `${done}/${DEPTS.length} departments checked in`;
      DEPTS.forEach(dept => {
        const item = document.getElementById('dept-' + dept.replace(/\s+/g, '-'));
        if (item) item.classList.toggle('checked', state.depts[dept]);
      });
    } else {
      const lbl = card.querySelector('.check-label');
      if (lbl) lbl.classList.toggle('checked', complete);
    }

    const noteEl  = card.querySelector('.note-indicator');
    if (noteEl) noteEl.style.display = state.notes[id] ? 'inline' : 'none';
  }

  function toggleStage(id) {
    state.stages[id] = !state.stages[id];
    save();
    updateCard(id);
    updateProgress();
  }

  function toggleDept(dept) {
    state.depts[dept] = !state.depts[dept];
    state.stages['dept_reviews'] = DEPTS.every(d => state.depts[d]);
    save();
    updateCard('dept_reviews');
    updateProgress();
  }

  function saveNote(id, val) {
    state.notes[id] = val;
    save();
    updateCard(id);
  }

  function toggleOpen(id) {
    const card = document.getElementById('card-' + id);
    card.classList.toggle('open');
  }

  function resetFlow() {
    if (!confirm('Reset all progress and notes?')) return;
    state = defaultState();
    save();
    render();
  }

  function render() {
    const container = document.getElementById('stages');
    container.innerHTML = '';

    STAGES.forEach((stage, idx) => {
      const complete = isStageComplete(stage.id);
      const card = document.createElement('div');
      card.className = 'stage-card' + (complete ? ' complete' : '');
      card.id = 'card-' + stage.id;

      let bodyInner = `<p class="stage-desc">${stage.desc}</p>`;

      if (stage.hasSubs) {
        const doneDepts = DEPTS.filter(d => state.depts[d]).length;
        bodyInner += `<div class="dept-grid">`;
        DEPTS.forEach(dept => {
          const checked = state.depts[dept];
          const safeId  = 'dept-' + dept.replace(/\s+/g, '-');
          bodyInner += `
            <label class="dept-item${checked ? ' checked' : ''}" id="${safeId}">
              <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleDept('${dept}')">
              ${dept}
            </label>`;
        });
        bodyInner += `</div>`;
      } else {
        bodyInner += `
          <label class="check-label${complete ? ' checked' : ''}">
            <input type="checkbox" ${complete ? 'checked' : ''} onchange="toggleStage('${stage.id}')">
            Mark as complete
          </label>`;
      }

      bodyInner += `
        <textarea rows="2" placeholder="Add notes for this stage..."
          onchange="saveNote('${stage.id}', this.value)"
        >${state.notes[stage.id] || ''}</textarea>`;

      const subtitle = stage.hasSubs
        ? `<div class="stage-subtitle">${DEPTS.filter(d => state.depts[d]).length}/${DEPTS.length} departments checked in</div>`
        : '';

      card.innerHTML = `
        <div class="stage-header" onclick="toggleOpen('${stage.id}')">
          <div class="stage-num">${complete ? '✓' : idx + 1}</div>
          <div class="stage-info">
            <div class="stage-title">${stage.label}</div>
            ${subtitle}
          </div>
          <span class="note-indicator" style="display:${state.notes[stage.id] ? 'inline' : 'none'}">note</span>
          <span class="chevron">▾</span>
        </div>
        <div class="stage-body">${bodyInner}</div>
      `;

      container.appendChild(card);
    });

    updateProgress();
  }

  load();
  render();
</script>
</body>
</html>

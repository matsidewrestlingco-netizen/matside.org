<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broadcast Hub — Matside Wrestling Co.</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0d1117;
      --bg-card:       #151b23;
      --bg-card-hover: #1c2430;
      --border:        #2a3441;
      --blue:          #4a8fd4;
      --blue-light:    #6aaee8;
      --blue-dim:      #1e3a52;
      --blue-dim-border: #2d5278;
      --white:         #ffffff;
      --gray:          #8b9ab0;
      --gray-dim:      #4a5568;
      --danger-border: #c9414f;
      --danger-text:   #ff6b7a;
      --danger-bg:     #6b2737;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border);
    }
    .logo-main {
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .logo-divider {
      width: 1px;
      height: 36px;
      background: var(--border);
    }
    .page-title {
      font-size: 13px;
      color: var(--gray);
    }

    /* ── Progress ── */
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 6px;
    }
    .progress-meta span:last-child { color: var(--blue); font-weight: 600; }
    .progress-bar-bg {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Complete banner ── */
    .complete-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--blue-dim);
      border: 0.5px solid var(--blue-dim-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 1.25rem;
    }
    .complete-banner.visible { display: flex; }
    .complete-banner span { font-size: 13px; color: var(--blue-light); font-weight: 500; }

    /* ── Stage cards ── */
    .stage-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
      margin-bottom: 8px;
    }
    .stage-card.complete { border-color: var(--blue-dim-border); }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .stage-header:hover { background: var(--bg-card-hover); }

    .stage-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      color: var(--gray);
      transition: all 0.2s;
    }
    .stage-card.complete .stage-num {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    .stage-info { flex: 1; }
    .stage-title { font-size: 14px; font-weight: 500; color: var(--white); }
    .stage-subtitle { font-size: 11px; color: var(--gray); margin-top: 2px; }

    .note-indicator { font-size: 11px; color: var(--gray-dim); margin-right: 4px; }
    .chevron { font-size: 12px; color: var(--gray-dim); transition: transform 0.2s; display: inline-block; }
    .stage-card.open .chevron { transform: rotate(180deg); }

    .stage-body {
      display: none;
      padding: 0 14px 14px;
      border-top: 0.5px solid var(--border);
    }
    .stage-card.open .stage-body { display: block; }

    .stage-desc {
      font-size: 13px;
      color: var(--gray);
      margin: 10px 0 12px;
      line-height: 1.5;
    }

    /* ── Dept grid ── */
    .dept-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dept-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 0.5px solid var(--border);
      transition: all 0.15s;
      color: var(--gray);
    }
    .dept-item.checked {
      background: var(--blue-dim);
      border-color: var(--blue-dim-border);
      color: var(--blue-light);
    }

    /* ── Check label ── */
    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 0.5px solid var(--border);
      width: fit-content;
      transition: all 0.15s;
      color: var(--gray);
      margin-bottom: 12px;
    }
    .check-label.checked {
      background: var(--blue-dim);
      border-color: var(--blue-dim-border);
      color: var(--blue-light);
    }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--white);
      outline: none;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.15s;
      min-height: 60px;
    }
    textarea:focus { border-color: var(--blue); }
    textarea::placeholder { color: var(--gray-dim); }

    /* ── Buttons ── */
    .btn-restart {
      background: transparent;
      color: var(--blue);
      border: 0.5px solid var(--blue-dim-border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-restart:hover { background: var(--blue-dim); }

    .btn-reset {
      background: transparent;
      color: var(--gray-dim);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-reset:hover { color: var(--gray); border-color: var(--gray-dim); }

    .footer-row {
      margin-top: 1rem;
      text-align: right;
    }

    input[type="checkbox"] {
      accent-color: var(--blue);
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>

  <iframe src="https://claude.site/public/artifacts/f2e3383c-12cb-4807-a6b5-c19eb93b634e/embed" title="Broadcast Hub" width="100%" height="600" frameborder="0" allow="clipboard-write" allowfullscreen></iframe>
  
</html>
